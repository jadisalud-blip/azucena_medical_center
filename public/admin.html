<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | Azucena Medical Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon: #00FFFF; 
            --dark: #1A1A1A; 
            --bg: #F4F7F6; 
            --white: #FFFFFF;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            background: var(--bg); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .admin-container {
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        h1 { font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; }
        h1 span { color: var(--neon); }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .module-card {
            background: var(--dark);
            padding: 50px 30px;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            transition: 0.4s;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .module-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px var(--neon);
            border: 1px solid var(--neon);
        }

        .icon { font-size: 4rem; margin-bottom: 20px; }
        .module-card h2 { font-weight: 900; margin: 0; text-transform: uppercase; }
        .module-card p { color: #888; margin-top: 10px; font-size: 0.9rem; }

        #btnSalir {
            margin-top: 50px;
            background: none;
            border: 2px solid #ccc;
            color: #666;
            padding: 10px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        #btnSalir:hover { background: #ff4444; color: white; border-color: #ff4444; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1 id="txtBienvenida">Azucena <span>Admin</span></h1>
        
        <div class="menu-grid">
            <a href="gestion.html" class="module-card">
                <span class="icon">⚙️</span>
                <h2>Gestión</h2>
                <p>Configuración general del sistema y datos internos.</p>
            </a>

            <a href="publicidad.html" class="module-card">
                <span class="icon">📣</span>
                <h2>Publicidad</h2>
                <p>Control de banners, index.html y redes sociales.</p>
            </a>
        </div>

        <button id="btnSalir">Cerrar Sesión</button>
    </div>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && ["admin", "programador", "dueño"].includes(docSnap.data().rol)) {
                    document.getElementById('txtBienvenida').innerHTML = `Bienvenido, <span>${docSnap.data().nombre}</span>`;
                } else {
                    alert("Acceso denegado."); 
                    window.location.href = "paciente.html";
                }
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('btnSalir').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "login.html");
        });
    </script>
</body>
</html>
