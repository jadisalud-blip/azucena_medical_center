<div class="grid-publicidad">
        <div class="card">
            <h2>1. Banners del Slider Principal</h2>
            <input type="text" id="pubTitulo" placeholder="Título">
            <input type="text" id="pubLinkGithub" placeholder="Link RAW GitHub">
            <select id="pubEstilo">
                <option value="oscuro">Modo Oscuro</option>
                <option value="claro">Modo Claro</option>
            </select>
            <button class="btn-save" id="btnGuardarPub">Añadir al Slider</button>
        </div>

        <div class="card">
            <h2>2. Especialidades</h2>
            <input type="text" id="servNombre" placeholder="Nombre">
            <textarea id="servDesc" placeholder="Descripción"></textarea>
            <input type="text" id="servIcono" placeholder="Emoji">
            <button class="btn-save" id="btnGuardarServicio">Añadir Servicio</button>
        </div>

        <div class="card">
            <h2>3. Contacto & Redes</h2>
            <input type="text" id="confWhatsapp" placeholder="WhatsApp">
            <input type="text" id="confFacebook" placeholder="Facebook">
            <input type="text" id="confInstagram" placeholder="Instagram">
            <input type="text" id="confDireccion" placeholder="Dirección">
            <input type="text" id="confMapa" placeholder="Link Google Maps">
            <button class="btn-save" id="btnGuardarContacto">Actualizar Todo</button>
        </div>

        <div class="card" style="border-top: 5px solid var(--neon);">
            <h2>4. Publicidad Extra / Promos</h2>
            <p style="font-size: 0.8rem;">Ideal para mostrar 3 imágenes estáticas o rotativas debajo de servicios.</p>
            <input type="text" id="extraImg" placeholder="Link de la imagen (GitHub)">
            <input type="text" id="extraLink" placeholder="¿A dónde lleva al dar clic? (Opcional)">
            <button class="btn-save" id="btnGuardarExtra" style="background:var(--neon); color:#000;">Publicar Extra</button>
        </div>
    </div>
    <script type="module" src="public/js/publicidad.js"></script>
