<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Publicidad | Azucena</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #00FFFF; --bg: #F4F7F6; --white: #FFFFFF; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); padding: 20px; }
        .grid-admin { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-top: 5px solid var(--neon); }
        h2 { font-size: 1rem; text-transform: uppercase; font-weight: 900; margin-bottom: 20px; color: #333; }
        label { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; display: block; margin: 10px 0 5px; opacity: 0.7; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-family: inherit; }
        .btn-sync { width: 100%; padding: 15px; background: var(--neon); border: none; border-radius: 10px; font-weight: 900; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-sync:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(0,255,255,0.4); }
        .status { font-size: 0.7rem; text-align: center; margin-top: 10px; color: #888; }
    </style>
</head>
<body>

    <h1 style="text-align:center; text-transform:uppercase; font-weight:900;">Panel de Publicidad Dinámica</h1>

    <div class="grid-admin">
        
        <div class="card">
            <h2><i class="fa-solid fa-heading"></i> 1. Encabezado & Botones</h2>
            <label>Nombre del Centro Médico</label>
            <input type="text" id="enc_nombre" placeholder="Azucena Medical Center">
            <label>Texto Botón Acción</label>
            <input type="text" id="enc_btn_txt" placeholder="Solicitar Cita / Acceso">
            <label>URL del Botón</label>
            <input type="text" id="enc_btn_url" placeholder="login.html o link de WhatsApp">
            <button class="btn-sync" onclick="syncEncabezado()">Actualizar Encabezado</button>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa- house-medical"></i> 2. Cuerpo (Slider y Especialidades)</h2>
            <label>Link Banner 1 (Principal)</label>
            <input type="text" id="cue_banner1" placeholder="Link de imagen GitHub Raw">
            <label>Servicio: Medicina General (Icono/Nombre)</label>
            <input type="text" id="cue_serv1" placeholder="fa-user-md | Medicina General">
            <label>Servicio: Traumatología (Icono/Nombre)</label>
            <input type="text" id="cue_serv2" placeholder="fa-bone | Traumatología">
            <p class="status">Más servicios se pueden añadir por código fácilmente.</p>
            <button class="btn-sync" onclick="syncCuerpo()">Actualizar Cuerpo</button>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-share-nodes"></i> 3. Redes Sociales</h2>
            <label>Facebook URL</label>
            <input type="text" id="red_fb" placeholder="https://facebook.com/...">
            <label>Instagram URL</label>
            <input type="text" id="red_ig" placeholder="https://instagram.com/...">
            <label>TikTok URL</label>
            <input type="text" id="red_tk" placeholder="https://tiktok.com/@...">
            <label>Red Social Propia / En Vivo (Futuro)</label>
            <input type="text" id="red_local" placeholder="Link de streaming o web local">
            <button class="btn-sync" onclick="syncRedes()">Sincronizar Redes</button>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-location-dot"></i> 4. Contacto y GPS</h2>
            <label>Dirección Escrita</label>
            <input type="text" id="con_dir" placeholder="Av. Amazonas y Gaspar de Villarroel">
            <label>WhatsApp (Formato 593...)</label>
            <input type="text" id="con_wa" placeholder="593999888777">
            <label>Google Maps Iframe (src)</label>
            <input type="text" id="con_mapa" placeholder="Solo el link dentro de src">
            <label>Link Directo GPS (Waze/Maps)</label>
            <input type="text" id="con_gps" placeholder="https://goo.gl/maps/...">
            <button class="btn-sync" onclick="syncContacto()">Actualizar Ubicación</button>
        </div>

    </div>

    <script type="module">
        import { db } from './public/js/firebase-config.js';
        import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // FUNCIONES DE SINCRONIZACIÓN
        window.syncEncabezado = async () => {
            await setDoc(doc(db, "publicidad", "encabezado"), {
                nombre: document.getElementById('enc_nombre').value,
                btn_txt: document.getElementById('enc_btn_txt').value,
                btn_url: document.getElementById('enc_btn_url').value,
                fecha: serverTimestamp()
            });
            alert("✅ Encabezado actualizado");
        };

        window.syncCuerpo = async () => {
            await setDoc(doc(db, "publicidad", "cuerpo"), {
                banners: [document.getElementById('cue_banner1').value],
                servicios: [
                    document.getElementById('cue_serv1').value,
                    document.getElementById('cue_serv2').value
                ],
                fecha: serverTimestamp()
            });
            alert("✅ Cuerpo y Banner actualizados");
        };

        window.syncRedes = async () => {
            await setDoc(doc(db, "publicidad", "redes"), {
                fb: document.getElementById('red_fb').value,
                ig: document.getElementById('red_ig').value,
                tk: document.getElementById('red_tk').value,
                local: document.getElementById('red_local').value,
                fecha: serverTimestamp()
            });
            alert("✅ Redes sociales sincronizadas");
        };

        window.syncContacto = async () => {
            await setDoc(doc(db, "publicidad", "contacto"), {
                direccion: document.getElementById('con_dir').value,
                whatsapp: document.getElementById('con_wa').value,
                mapa: document.getElementById('con_mapa').value,
                gps: document.getElementById('con_gps').value,
                fecha: serverTimestamp()
            });
            alert("✅ Ubicación y GPS listos");
        };
    </script>
</body>
</html>
