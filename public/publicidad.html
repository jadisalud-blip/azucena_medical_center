<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Publicidad | Azucena</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00FFFF; --dark: #1A1A1A; --bg: #F4F7F6; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 30px; }
        .btn-back { text-decoration: none; color: var(--dark); font-weight: 700; border: 2px solid var(--dark); padding: 8px 20px; border-radius: 50px; }
        
        .grid-publicidad { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .card h2 { font-weight: 900; text-transform: uppercase; font-size: 1.2rem; margin-top: 0; border-bottom: 3px solid var(--neon); display: inline-block; }
        
        input, textarea, select { 
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; font-family: inherit; box-sizing: border-box;
        }

        .btn-save { 
            width: 100%; background: var(--dark); color: var(--neon); border: none; padding: 15px; 
            border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px;
        }
        
        .preview-img { width: 100%; height: 100px; object-fit: cover; border-radius: 10px; background: #eee; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Megáfono <span>Azucena</span></h1>
        <a href="admin.html" class="btn-back">⬅ Volver</a>
    </div>

    <div class="grid-publicidad">
        
        <div class="card">
            <h2>1. Banners del Index</h2>
            <p style="font-size: 0.8rem; color: #888;">Usa links de GitHub para las imágenes.</p>
            <input type="text" id="pubTitulo" placeholder="Título del Banner">
            <input type="text" id="pubLinkGithub" placeholder="Link RAW de GitHub">
            <select id="pubEstilo">
                <option value="oscuro">Modo Oscuro (Texto Blanco)</option>
                <option value="claro">Modo Claro (Texto Negro)</option>
            </select>
            <button class="btn-save" id="btnGuardarPub">Añadir al Slider</button>
        </div>

        <div class="card">
            <h2>2. Servicios & Promos</h2>
            <input type="text" id="servNombre" placeholder="Nombre (Ej: Odontología 2x1)">
            <textarea id="servDesc" placeholder="Descripción corta de la promo"></textarea>
            <input type="text" id="servIcono" placeholder="Emoji representativo (🩺, 🦷, 🎁)">
            <button class="btn-save" id="btnGuardarServicio">Publicar en Index</button>
        </div>

        <div class="card">
            <h2>3. Contacto & Canales</h2>
            <input type="text" id="confWhatsapp" placeholder="WhatsApp (Ej: 593999...)">
            <input type="text" id="confFacebook" placeholder="Link de Facebook">
            <input type="text" id="confInstagram" placeholder="Link de Instagram">
            <input type="text" id="confDireccion" placeholder="Dirección Física">
            <input type="text" id="confMapa" placeholder="Link de Google Maps (Compartir)">
            <button class="btn-save" id="btnGuardarContacto" style="background: var(--neon); color: var(--dark);">Actualizar Todo</button>
        </div>

    </div>

    <script type="module" src="public/js/publicidad.js"></script>
</body>
</html>
