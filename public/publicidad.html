<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Azucena | Control Total</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #00FFFF; --dark: #1A1A1A; --bg: #F4F7F6; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); padding: 20px; color: var(--dark); }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 25px; border-left: 8px solid var(--dark); }
        h2 { text-transform: uppercase; font-size: 1rem; border-bottom: 2px solid var(--neon); padding-bottom: 10px; }
        
        /* Estilo de la fila que aparece */
        .fila-dinamica { 
            display: flex; 
            gap: 10px; 
            margin-top: 10px; 
            padding: 10px; 
            background: #f9f9f9; 
            border-radius: 10px; 
            border: 1px solid #eee;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 5px; box-sizing: border-box; }
        .btn-add { background: var(--dark); color: var(--neon); border: none; padding: 10px 15px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-del { background: #ff4757; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
        .btn-save { width: 100%; padding: 20px; background: var(--neon); color: black; border: none; border-radius: 15px; font-weight: 900; font-size: 1.2rem; cursor: pointer; margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center; font-weight:900;">ADMINISTRADOR PUBLICITARIO</h1>

    <div class="card">
        <h2>1. Encabezado (Menú)</h2>
        <label>Nombre del Centro</label>
        <input type="text" id="h_nombre" placeholder="Ej: Azucena Medical Center">
        
        <label>Servicios que aparecerán en el menú:</label>
        <div id="lista_menu"></div> <button class="btn-add" onclick="agregarItemMenu()">+ Añadir Servicio al Menú</button>
    </div>

    <div class="card">
        <h2>2. Cuerpo y Especialidades</h2>
        <label>Eslogan</label>
        <input type="text" id="c_eslogan">
        
        <label>Detalle de Servicios (Imagen + Texto)</label>
        <div id="lista_servicios_det"></div> <button class="btn-add" onclick="agregarServicioDetalle()">+ Añadir Detalle Completo</button>
    </div>

    <button class="btn-save" id="btn_final_save">🚀 ACTUALIZAR TODO</button>
</div>

<script>
    // ESTO VA FUERA DEL MÓDULO PARA QUE LOS BOTONES FUNCIONEN SÍ O SÍ
    function agregarItemMenu() {
        const contenedor = document.getElementById('lista_menu');
        const div = document.createElement('div');
        div.className = 'fila-dinamica';
        div.innerHTML = `
            <input type="text" placeholder="Escribe el servicio aquí..." class="val_menu_item">
            <button class="btn-del" onclick="this.parentElement.remove()">X</button>
        `;
        contenedor.appendChild(div);
    }

    function agregarServicioDetalle() {
        const contenedor = document.getElementById('lista_servicios_det');
        const div = document.createElement('div');
        div.className = 'fila-dinamica';
        div.innerHTML = `
            <input type="text" placeholder="Servicio" class="det_nom" style="width:30%">
            <input type="text" placeholder="Descripción corta" class="det_txt" style="width:40%">
            <input type="text" placeholder="URL Imagen" class="det_img" style="width:30%">
            <button class="btn-del" onclick="this.parentElement.remove()">X</button>
        `;
        contenedor.appendChild(div);
    }
</script>

<script type="module">
    import { db } from './public/js/firebase-config.js';
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    document.getElementById('btn_final_save').onclick = async () => {
        try {
            // Recoger datos del menú
            const menu = Array.from(document.querySelectorAll('.val_menu_item')).map(i => i.value);
            
            // Recoger datos de servicios
            const servicios = Array.from(document.querySelectorAll('#lista_servicios_det .fila-dinamica')).map(f => ({
                nombre: f.querySelector('.det_nom').value,
                texto: f.querySelector('.det_txt').value,
                img: f.querySelector('.det_img').value
            }));

            // Guardar en Firebase
            await setDoc(doc(db, "publicidad", "encabezado"), { nombre: document.getElementById('h_nombre').value, menu: menu });
            await setDoc(doc(db, "publicidad", "cuerpo"), { eslogan: document.getElementById('c_eslogan').value, servicios: servicios });

            alert("✅ ¡Magia! Datos guardados.");
        } catch (e) {
            alert("Error: " + e.message);
        }
    };
</script>

</body>
</html>
