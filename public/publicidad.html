<div class="grid-marketing">
    <div class="card">
        <h2>Editar Slider</h2>
        <input type="text" id="pubTitulo" placeholder="Título (Ej: Salud Total)">
        <input type="text" id="pubLinkGithub" placeholder="Link de Foto GitHub">
        <button class="btn-save" id="btnGuardarPub">Actualizar Slider</button>
    </div>

    <div class="card">
        <h2>Añadir Especialidad</h2>
        <input type="text" id="servNombre" placeholder="Ej: Ginecología">
        <input type="text" id="servDesc" placeholder="Breve descripción">
        <input type="text" id="servIcono" placeholder="Clase de FontAwesome (Ej: fa-solid fa-heart)">
        <button class="btn-save" id="btnGuardarServicio">Publicar Servicio</button>
    </div>

    <div class="card">
        <h2>GPS y Redes</h2>
        <input type="text" id="confDireccion" placeholder="Dirección Escrita">
        <input type="text" id="confWhatsapp" placeholder="WhatsApp (Ej: 593...)">
        <input type="text" id="confLinkGps" placeholder="Link 'Cómo llegar' de Maps">
        <input type="text" id="confMapaIframe" placeholder="Link del IFRAME (src)">
        <input type="text" id="confFacebook" placeholder="Link Facebook">
        <input type="text" id="confInstagram" placeholder="Link Instagram">
        <input type="text" id="confTiktok" placeholder="Link TikTok">
        <button class="btn-save" id="btnGuardarContacto">Sincronizar Web</button>
    </div>
</div>
