<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Marketing | Azucena</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #00FFFF; --dark: #1A1A1A; --bg: #F4F7F6; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px; border-top: 5px solid var(--dark); }
        h2 { text-transform: uppercase; font-size: 1.1rem; border-bottom: 2px solid var(--neon); padding-bottom: 10px; margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-top: 15px; opacity: 0.7; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin-top: 5px; box-sizing: border-box; font-family: inherit; }
        
        .dinamico-row { display: flex; gap: 10px; margin-bottom: 10px; background: #fdfdfd; padding: 15px; border-radius: 10px; border: 1px solid #eee; align-items: center; }
        .btn-add { background: var(--dark); color: var(--neon); border: none; padding: 10px 20px; border-radius: 50px; font-weight: 900; cursor: pointer; margin-top: 10px; font-size: 0.8rem; text-transform: uppercase; }
        .btn-gps { background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 700; width: 100%; margin-top: 10px; text-transform: uppercase; }
        .btn-del { background: #ff4757; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
        
        .btn-save-all { width: 100%; padding: 20px; background: var(--neon); color: black; border: none; border-radius: 15px; font-weight: 900; font-size: 1.2rem; cursor: pointer; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,255,255,0.3); text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center; font-weight:900; text-transform: uppercase;">Central de Publicidad</h1>

    <div class="card">
        <h2><i class="fa-solid fa-window-maximize"></i> 1. Encabezado</h2>
        <label>Nombre del Centro Médico</label>
        <input type="text" id="h_nombre" placeholder="Nombre de la clínica">
        
        <label>Listado de Servicios (Menú de Navegación)</label>
        <div id="cont_menu_servicios"></div>
        <button class="btn-add" id="btn_add_menu_serv">+ Añadir Servicio al Menú</button>
        
        <label>Botón de Acceso (URL)</label>
        <input type="text" id="h_url_acceso" value="login.html">
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-layer-group"></i> 2. Cuerpo del Index</h2>
        <label>Eslogan Principal</label>
        <input type="text" id="c_eslogan" placeholder="Frase de impacto">
        
        <label>URL Logotipo</label>
        <input type="text" id="c_logo_url" placeholder="Link de imagen del logo">

        <label>Detalle de Servicios con Imagen (Contenido)</label>
        <div id="cont_servicios_det"></div>
        <button class="btn-add" id="btn_add_serv_det">+ Añadir Detalle de Servicio</button>

        <label>Horarios de Atención</label>
        <textarea id="c_horarios" rows="3" placeholder="Ej: Lunes a Viernes 08:00 - 19:00"></textarea>

        <label>Vídeos de YouTube (URLs)</label>
        <div id="cont_videos"></div>
        <button class="btn-add" id="btn_add_video">+ Añadir Vídeo</button>

        <label>Ubicación (Coordenadas GPS)</label>
        <div style="display:flex; gap:10px;">
            <input type="text" id="loc_lat" placeholder="Latitud" readonly>
            <input type="text" id="loc_lng" placeholder="Longitud" readonly>
        </div>
        <button class="btn-gps" id="btn_get_gps"><i class="fa-solid fa-location-crosshairs"></i> Capturar mi ubicación actual</button>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-address-card"></i> 3. Pie de Página</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label>Teléfono Convencional</label>
                <input type="text" id="f_tel">
            </div>
            <div>
                <label>WhatsApp</label>
                <input type="text" id="f_wa">
            </div>
        </div>
        <label>Correo Electrónico</label>
        <input type="email" id="f_mail">

        <label>Redes Sociales (Links)</label>
        <input type="text" id="f_tk" placeholder="TikTok URL" style="margin-bottom:5px;">
        <input type="text" id="f_ig" placeholder="Instagram URL" style="margin-bottom:5px;">
        <input type="text" id="f_fb" placeholder="Facebook URL" style="margin-bottom:5px;">
        <input type="text" id="f_yt" placeholder="YouTube Canal URL">
    </div>

    <button class="btn-save-all" id="btn_final_save">🚀 Guardar Cambios en la Web</button>
</div>

<script type="module">
    import { db } from './public/js/firebase-config.js';
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- MANEJO DE FILAS DINÁMICAS ---
    const agregarFila = (idContenedor, contenidoHtml) => {
        const contenedor = document.getElementById(idContenedor);
        const div = document.createElement('div');
        div.className = 'dinamico-row';
        div.innerHTML = contenidoHtml + `<button class="btn-del" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>`;
        contenedor.appendChild(div);
    };

    // Eventos para añadir ítems
    document.getElementById('btn_add_menu_serv').onclick = () => 
        agregarFila('cont_menu_servicios', `<input type="text" placeholder="Nombre del servicio (Menú)" class="menu_item_val">`);

    document.getElementById('btn_add_serv_det').onclick = () => 
        agregarFila('cont_servicios_det', `
            <input type="text" placeholder="Servicio" class="det_nom" style="width:25%">
            <input type="text" placeholder="Contexto/Detalle" class="det_txt" style="width:40%">
            <input type="text" placeholder="URL Imagen" class="det_img" style="width:25%">
        `);

    document.getElementById('btn_add_video').onclick = () => 
        agregarFila('cont_videos', `<input type="text" placeholder="Link de Video YouTube" class="video_val">`);

    // --- FUNCIÓN GPS ---
    document.getElementById('btn_get_gps').onclick = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                document.getElementById('loc_lat').value = pos.coords.latitude;
                document.getElementById('loc_lng').value = pos.coords.longitude;
                alert("📍 Coordenadas obtenidas correctamente");
            }, (err) => alert("Error GPS: " + err.message));
        } else {
            alert("Tu navegador no soporta GPS.");
        }
    };

    // --- GUARDADO FINAL ---
    document.getElementById('btn_final_save').onclick = async () => {
        const btn = document.getElementById('btn_final_save');
        btn.innerText = "⏳ PROCESANDO...";
        btn.disabled = true;

        try {
            // 1. Datos Encabezado
            const menuData = Array.from(document.querySelectorAll('.menu_item_val')).map(el => el.value);
            await setDoc(doc(db, "publicidad", "encabezado"), {
                nombre: document.getElementById('h_nombre').value,
                servicios_menu: menuData,
                url_acceso: document.getElementById('h_url_acceso').value
            });

            // 2. Datos Cuerpo
            const serviciosDet = Array.from(document.querySelectorAll('#cont_servicios_det .dinamico-row')).map(row => ({
                nombre: row.querySelector('.det_nom').value,
                detalle: row.querySelector('.det_txt').value,
                imagen: row.querySelector('.det_img').value
            }));
            const videosData = Array.from(document.querySelectorAll('.video_val')).map(el => el.value);

            await setDoc(doc(db, "publicidad", "cuerpo"), {
                eslogan: document.getElementById('c_eslogan').value,
                logo: document.getElementById('c_logo_url').value,
                servicios_lista: serviciosDet,
                horarios: document.getElementById('c_horarios').value,
                videos: videosData,
                latitud: document.getElementById('loc_lat').value,
                longitud: document.getElementById('loc_lng').value,
                actualizado: serverTimestamp()
            });

            // 3. Datos Pie
            await setDoc(doc(db, "publicidad", "pie"), {
                telefono: document.getElementById('f_tel').value,
                whatsapp: document.getElementById('f_wa').value,
                correo: document.getElementById('f_mail').value,
                redes: {
                    tiktok: document.getElementById('f_tk').value,
                    instagram: document.getElementById('f_ig').value,
                    facebook: document.getElementById('f_fb').value,
                    youtube: document.getElementById('f_yt').value
                }
            });

            alert("🔥 ¡ESTRUCTURA CREADA! La base de datos se actualizó correctamente.");
        } catch (e) {
            console.error(e);
            alert("Error al sincronizar: " + e.message);
        } finally {
            btn.innerText = "🚀 GUARDAR Y ACTUALIZAR WEB";
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
