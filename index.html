<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azucena Medical Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --neon: #00FFFF;
            --dark: #1A1A1A;
            --white: #FFFFFF;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* FONDO ESTÉTICO */
        .bg-overlay {
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(0,255,255,0.05) 100%);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .logo span {
            color: var(--neon);
            text-shadow: 0 0 15px rgba(0,255,255,0.5);
        }

        .slogan {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* BOTÓN DE ACCESO ÚNICO */
        .btn-acceso {
            display: inline-block;
            padding: 20px 60px;
            background-color: var(--dark);
            color: var(--neon);
            text-decoration: none;
            font-weight: 900;
            font-size: 1.1rem;
            border-radius: 50px;
            border: 2px solid var(--neon);
            transition: 0.4s;
            box-shadow: 0 10px 30px rgba(0,255,255,0.2);
            text-transform: uppercase;
        }

        .btn-acceso:hover {
            background-color: var(--neon);
            color: var(--dark);
            box-shadow: 0 0 40px var(--neon);
            transform: translateY(-5px);
        }

        /* DECORACIÓN */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: var(--neon);
            filter: blur(80px);
            opacity: 0.1;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    
    <div class="circle" style="width: 400px; height: 400px; top: -100px; left: -100px;"></div>
    <div class="circle" style="width: 300px; height: 300px; bottom: -50px; right: -50px;"></div>

    <div class="content">
        <div class="logo">Azucena<span>Medical</span></div>
        <div class="slogan">Excelencia Médica de Élite</div>
        
        <a href="login.html" class="btn-acceso">ACCESO</a>
    </div>

</body>
</html>
