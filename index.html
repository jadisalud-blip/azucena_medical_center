<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azucena Medical Center | Tech Médica de Élite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFFFF;
            --main-neon: #00FFFF;
            --main-neon-glow: rgba(0, 255, 255, 0.4);
            --text-color: #1A1A1A;
            --dark: #1A1A1A;
            --card-bg: #F8F9FA;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* NAVBAR */
        .navbar {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            box-sizing: border-box;
            z-index: 1000;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo { font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--dark); }
        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 700; margin-left: 20px; font-size: 0.8rem; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover { color: var(--main-neon); }

        /* HERO / SLIDER */
        .hero-slider { width: 100%; height: 90vh; background: #111; position: relative; overflow: hidden; }
        .slide {
            width: 100%; height: 100%;
            position: absolute;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide.active { opacity: 1; z-index: 10; }
        .slide-overlay {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center;
            padding: 0 20px;
        }
        .title-jadi { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; text-transform: uppercase; margin: 0; line-height: 0.9; }
        .btn-jadi {
            margin-top: 30px;
            background-color: var(--main-neon);
            color: #000;
            padding: 18px 45px;
            font-size: 1rem;
            font-weight: 900;
            text-decoration: none;
            border-radius: 100px;
            text-transform: uppercase;
            box-shadow: 0 10px 25px var(--main-neon-glow);
            transition: 0.3s;
        }

        /* SECCIONES */
        .container { max-width: 1200px; margin: 0 auto; padding: 80px 20px; }
        .section-title { text-align: center; margin-bottom: 50px; }
        .section-title h2 { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; }

        /* SERVICIOS GRID */
        .servicios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .servicio-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            border: 1px solid #EEE;
            transition: 0.3s;
        }
