<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azucena Medical Center | Bienvenidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --neon: #00FFFF;
            --dark: #1A1A1A;
            --white: #FFFFFF;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--white);
            color: var(--dark);
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        .logo { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .logo span { color: var(--neon); text-shadow: 0 0 10px rgba(0, 255, 255, 0.3); }

        /* HERO SECTION */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
            background: radial-gradient(circle at top right, rgba(0,255,255,0.05), transparent),
                        radial-gradient(circle at bottom left, rgba(0,255,255,0.05), transparent);
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 1.2rem;
            color: #666;
            margin: 20px 0 40px;
            max-width: 600px;
        }

        /* EL BOTÓN QUE SOLICITASTE */
        .btn-acceso {
            background: var(--dark);
            color: var(--neon);
            padding: 20px 50px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            border: 2px solid var(--neon);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2);
        }

        .btn-acceso:hover {
            background: var(--neon);
            color: var(--dark);
            transform: scale(1.05);
            box-shadow: 0 0 40px var(--neon);
        }

        /* FOOTER SIMPLIFICADO */
        footer {
            padding: 30px;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .hero p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Azucena<span>Medical</span></div>
    </nav>

    <main class="hero">
        <h1 id="txt_eslogan">Excelencia Médica <br><span>Tecnológica</span></h1>
        
        <p>Tu salud en manos de expertos con tecnología de última generación.</p>
        
        <a href="login.html" class="btn-acceso">Acceso</a>
    </main>

    <footer>
        &copy; 2026 Azucena Medical Center. Todos los derechos reservados.
    </footer>

    <script type="module">
        import { db } from './public/js/firebase-config.js';
        import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Aquí es donde en el siguiente paso "escucharemos" la base de datos
        // para cambiar el texto del eslogan o el nombre automáticamente.
    </script>
</body>
</html>
